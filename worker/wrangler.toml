name = "vokabulator-navigium"
main = "index.mjs"
compatibility_date = "2026-10-08"
workers_dev = true
preview_urls = false
# No storage bindings. Request logging is disabled.
[observability]
enabled = false

# PLACEHOLDER namespace IDs: replace with two distinct account-unique numeric IDs.
# Native rate counters only, no application storage. No secret values belong here.
[[ratelimits]]
name = "LOOKUP_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 128, period = 60 }

[[ratelimits]]
name = "SESSION_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 3, period = 60 }
